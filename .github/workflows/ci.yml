name: CI

# The 1.x line's CI (support/php7.4, #29). This branch is main's tree downgraded for PHP 7.4 once and
# never regenerated, so it is proven here on its own, not by main's php74 job, which only proves that
# main still downgrades.
#
# GitHub reads a push's workflows from the pushed commit, so this file, not main's, is what runs for
# this branch and for a tag cut on it: without the branch and tag triggers below the line would have
# no CI at all. The release-line guard runs in its own workflow, release-line.yml, which is main's
# unchanged.
on:
  push:
    branches: [support/php7.4]
    tags: ["v*"]
  pull_request:
    branches: [support/php7.4]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Style at @PSR12 (Rector's output is not @PER-CS clean) and PHPStan at phpVersion 70400, both on a
  # real PHP 7.4, the floor composer.json declares.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          coverage: none
          tools: composer:v2
      - name: Validate composer.json
        run: composer validate --strict
      - name: Version check
        run: make version-check
      - name: Install dependencies
        run: composer install --no-interaction --no-progress
      - name: Coding style (php-cs-fixer, @PSR12)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - name: Static analysis (phpstan, phpVersion 70400)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

  # Every PHP this line installs on. Composer resolves 1.x on PHP 7.4, 8.0 and 8.1 by itself, since 2.x
  # needs 8.2, and a project that requires ^1.0 gets it on 8.2 and later too. composer.json's
  # config.platform.php keeps the dependencies at what PHP 7.4 can run, whichever PHP installs them.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ["7.4", "8.0", "8.1", "8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --no-progress
      - name: Run tests
        run: vendor/bin/phpunit

  # The container smoke test, part one: the integration suite on PHP 7.4 against a real server.
  # scripts/octonomy-harness.sh boots Postgres plus the digest-pinned Octonomy image and seeds the
  # corpus; OCTONOMY_INTEGRATION_REQUIRED=1 turns the suite's no-harness skip into a failure.
  integration:
    name: integration suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Set up PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --no-progress
      - name: Boot and seed the Octonomy harness
        run: scripts/octonomy-harness.sh up
      # The harness mints real bearer tokens. Mask every *_TOKEN value before any later step can
      # print one; the server is ephemeral, but a token in a job log is still a leak.
      - name: Mask harness credentials
        run: |
          env_file=$(scripts/octonomy-harness.sh env)
          while IFS= read -r line; do
            case "${line%%=*}" in
              *_TOKEN) echo "::add-mask::${line#*=}" ;;
            esac
          done < "$env_file"
      - name: Integration suite against the real server
        env:
          OCTONOMY_INTEGRATION_REQUIRED: "1"
        run: make test-integration
      - name: Dump harness logs
        if: failure()
        run: scripts/octonomy-harness.sh logs
      - name: Tear down the harness
        if: always()
        run: scripts/octonomy-harness.sh down

  # The container smoke test, part two: the package the way a PHP 7.4 user meets it. It is installed
  # into an empty project on PHP 7.4 from this checkout through a mirrored path repository, so Composer
  # resolves its dependencies for 7.4 by itself; the dev server then boots through the generated bin
  # proxy and runs every example the package ships, twice, against the same server.
  dev-server:
    name: dev server (Composer project)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Set up PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          coverage: none
          tools: composer:v2
      # `versions` pins the package to this branch's dev version whatever ref the checkout is on (a
      # pull request's merge commit is a detached HEAD, from which Composer cannot guess a branch).
      - name: Install the SDK into an empty project
        run: |
          mkdir "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          printf '{"repositories": [{"type": "path", "url": "%s", "options": {"symlink": false, "versions": {"octoverse-id/octonomy-php": "dev-support/php7.4"}}}]}\n' "$GITHUB_WORKSPACE" > composer.json
          composer require --no-interaction --no-progress octoverse-id/octonomy-php:dev-support/php7.4
      - name: Use FixtureClient from the install
        working-directory: ${{ runner.temp }}/consumer
        run: |
          php -r '
            require "vendor/autoload.php";
            $fake = Octoverse\Octonomy\Testing\FixtureClient::withCapturedFixtures();
            $client = new Octoverse\Octonomy\Client(["base_url" => "https://octonomy.test", "token" => "t", "tenant_id" => "t", "http_client" => $fake]);
            $slug = $client->tags()->get("t1")->slug;
            $fake->assertSent("GET", "tags/t1");
            echo "FixtureClient answered GET tags/t1 with the captured tag \"{$slug}\" on PHP " . PHP_VERSION . "\n";
          '
      - name: Boot the dev server
        working-directory: ${{ runner.temp }}/consumer
        run: vendor/bin/octonomy-dev-server up
      - name: Mask dev-server credentials
        working-directory: ${{ runner.temp }}/consumer
        run: |
          env_file=$(vendor/bin/octonomy-dev-server env)
          while IFS= read -r line; do
            case "${line%%=*}" in
              *_TOKEN) echo "::add-mask::${line#*=}" ;;
            esac
          done < "$env_file"
      - name: Run every example through it
        working-directory: ${{ runner.temp }}/consumer
        run: |
          for example in vendor/octoverse-id/octonomy-php/examples/*.php; do
            echo "::group::examples/${example##*/}"
            vendor/bin/octonomy-dev-server run "examples/${example##*/}"
            echo "::endgroup::"
          done
      - name: Run them again against the same server
        working-directory: ${{ runner.temp }}/consumer
        run: |
          for example in vendor/octoverse-id/octonomy-php/examples/*.php; do
            echo "::group::examples/${example##*/}"
            vendor/bin/octonomy-dev-server run "examples/${example##*/}"
            echo "::endgroup::"
          done
      - name: Dump dev-server logs
        if: failure()
        working-directory: ${{ runner.temp }}/consumer
        run: vendor/bin/octonomy-dev-server logs
      - name: Tear down the dev server
        if: always()
        working-directory: ${{ runner.temp }}/consumer
        run: vendor/bin/octonomy-dev-server down
      - name: Nothing is left behind
        working-directory: ${{ runner.temp }}/consumer
        run: |
          test -z "$(docker ps -aq --filter name=octonomy-php-dev-server)"
          test -z "$(docker network ls -q --filter name=octonomy-php-dev-server)"
          test ! -e vendor/octoverse-id/octonomy-php/.octonomy-dev-server.env
