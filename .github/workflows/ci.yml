name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2
      - name: Validate composer.json
        run: composer validate --strict
      - name: Install dependencies
        run: composer install --no-interaction --no-progress
      - name: Coding style (php-cs-fixer)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
        env:
          PHP_CS_FIXER_IGNORE_ENV: "1"
      - name: Static analysis (phpstan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --no-progress
      - name: Run tests
        run: vendor/bin/phpunit

  # The PHP 7.4 line (epic #4). Rector downgrades the tree into a throwaway directory, and the result
  # is proven on a real PHP 7.4: lint, @PSR12, PHPStan at phpVersion 70400, and PHPUnit 9.6 running
  # exactly the tests main runs. Nothing is committed and no branch is involved; support/php7.4 is
  # generated by the same script in P5. It needs no other job, so it runs beside the 8.x matrix.
  php74:
    name: PHP 7.4 (downgraded)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Set up PHP 8.3 for Rector
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --no-progress
      - name: Install Rector (tools/rector)
        run: composer install --working-dir=tools/rector --no-interaction --no-progress
      # Fails on Rector's own exit status, never on `php -l` alone (issue #5).
      - name: Downgrade into a temp dir
        run: scripts/php74-downgrade.sh "$RUNNER_TEMP/php74"
      - name: Record the tests main runs
        run: vendor/bin/phpunit --log-junit "$RUNNER_TEMP/main-junit.xml"
      - name: Set up PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          coverage: none
          tools: composer:v2
      - name: Install the 7.4 tree's dependencies
        working-directory: ${{ runner.temp }}/php74
        run: |
          composer validate --strict
          composer install --no-interaction --no-progress
      - name: Prove the tree on PHP 7.4
        run: scripts/php74-check.sh "$RUNNER_TEMP/php74" "$RUNNER_TEMP/main-junit.xml"

  # The integration suite against a real server: scripts/octonomy-harness.sh boots Postgres plus the
  # digest-pinned Octonomy image, seeds the corpus, and asserts each partition reads back as seeded.
  # OCTONOMY_INTEGRATION_REQUIRED=1 turns the suite's no-harness skip into a failure, because here a
  # skip would mean the boot silently did not happen.
  integration:
    name: integration suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --no-progress
      - name: Boot and seed the Octonomy harness
        run: scripts/octonomy-harness.sh up
      # The harness mints real bearer tokens. Mask every *_TOKEN value before any later step can
      # print one; the server is ephemeral, but a token in a job log is still a leak.
      - name: Mask harness credentials
        run: |
          env_file=$(scripts/octonomy-harness.sh env)
          while IFS= read -r line; do
            case "${line%%=*}" in
              *_TOKEN) echo "::add-mask::${line#*=}" ;;
            esac
          done < "$env_file"
      - name: Integration suite against the real server
        env:
          OCTONOMY_INTEGRATION_REQUIRED: "1"
        run: make test-integration
      - name: Dump harness logs
        if: failure()
        run: scripts/octonomy-harness.sh logs
      - name: Tear down the harness
        if: always()
        run: scripts/octonomy-harness.sh down

  # The Composer bin end to end (#13), the way a user meets it. The SDK is installed into an empty
  # project from this checkout through a mirrored path repository, so the package has no vendor/ of
  # its own and vendor/bin/octonomy-dev-server is Composer's generated proxy; the dev server then
  # boots through that proxy, runs the quickstart, and is torn down with nothing left behind.
  # DevServerTest covers the bin's layouts with a fake docker; this is the one place the real proxy,
  # the boot, the env translation and the quickstart meet.
  dev-server:
    name: dev server (Composer project)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2
      # `versions` pins the package to dev-main whatever ref the checkout is on (a pull request's
      # merge commit is a detached HEAD, from which Composer cannot guess a branch).
      - name: Install the SDK into an empty project
        run: |
          mkdir "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          printf '{"repositories": [{"type": "path", "url": "%s", "options": {"symlink": false, "versions": {"octoverse-id/octonomy-php": "dev-main"}}}]}\n' "$GITHUB_WORKSPACE" > composer.json
          composer require --no-interaction --no-progress octoverse-id/octonomy-php:dev-main
      - name: Boot the dev server
        working-directory: ${{ runner.temp }}/consumer
        run: vendor/bin/octonomy-dev-server up
      # The same masking as the integration job: the dev server mints real bearer tokens too.
      - name: Mask dev-server credentials
        working-directory: ${{ runner.temp }}/consumer
        run: |
          env_file=$(vendor/bin/octonomy-dev-server env)
          while IFS= read -r line; do
            case "${line%%=*}" in
              *_TOKEN) echo "::add-mask::${line#*=}" ;;
            esac
          done < "$env_file"
      # Reuses the server booted above, since `run` boots only when none is up. From the project
      # root, examples/quickstart.php resolves to the SDK's own copy under vendor/.
      - name: Run the quickstart through it
        working-directory: ${{ runner.temp }}/consumer
        run: vendor/bin/octonomy-dev-server run examples/quickstart.php
      - name: Dump dev-server logs
        if: failure()
        working-directory: ${{ runner.temp }}/consumer
        run: vendor/bin/octonomy-dev-server logs
      - name: Tear down the dev server
        if: always()
        working-directory: ${{ runner.temp }}/consumer
        run: vendor/bin/octonomy-dev-server down
      - name: Nothing is left behind
        working-directory: ${{ runner.temp }}/consumer
        run: |
          test -z "$(docker ps -aq --filter name=octonomy-php-dev-server)"
          test -z "$(docker network ls -q --filter name=octonomy-php-dev-server)"
          test ! -e vendor/octoverse-id/octonomy-php/.octonomy-dev-server.env
