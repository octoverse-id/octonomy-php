version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    # Bundle minor + patch bumps into a single PR. Major bumps still arrive as
    # their own PRs so they get individual review.
    groups:
      composer-packages:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # The Rector that downgrades main to PHP 7.4 (tools/rector). It is pinned to one exact version
  # because its output ships on the 7.4 line, so every bump arrives as its own PR and is proven by
  # CI's php74 job before it lands.
  - package-ecosystem: "composer"
    directory: "/tools/rector"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
