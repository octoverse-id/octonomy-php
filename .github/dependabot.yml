version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    # Bundle minor + patch bumps into a single PR. Major bumps still arrive as
    # their own PRs so they get individual review.
    groups:
      composer-packages:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # The Rector that downgrades main to PHP 7.4 (tools/rector). It is pinned to one exact version
  # because its output ships on the 7.4 line. The PHPStan it runs on is pinned exactly beside it,
  # since Rector's own range would float: PHPStan 2.3.4 breaks Rector 2.7.0 and 2.8.1, and Rector
  # 2.8.3 and later need it. The group bumps the two in one PR, since neither can move alone. Only
  # CI's php74 job proves a bump, and it is not a required check, so dependabot-auto-merge.yml
  # leaves these PRs for a person to merge once it is green.
  - package-ecosystem: "composer"
    directory: "/tools/rector"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    groups:
      rector-and-phpstan:
        patterns:
          - "rector/rector"
          - "phpstan/phpstan"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
