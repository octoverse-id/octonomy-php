      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        tenant_id:
          type: string
          readOnly: true
        application_id:
          type: string
          maxLength: 100
        tag_id:
          type: string
          format: uuid
          readOnly: true
        resource_type:
          type: string
          maxLength: 100
        resource_id:
          type: string
          maxLength: 255
        assigned_by:
          type: string
          nullable: true
          maxLength: 255
        assigned_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - application_id
      - assigned_at
      - id
      - resource_id
      - resource_type
      - tag_id
      - tenant_id
    AssignmentWrite:
      type: object
      properties:
        application_id:
          type: string
          maxLength: 100
        tag_id:
          type: string
          format: uuid
        alias_id:
          type: string
          format: uuid
        alias_slug:
          type: string
          maxLength: 255
        resource_type:
          type: string
          maxLength: 100
        resource_id:
          type: string
          maxLength: 255
        assigned_by:
          type: string
          nullable: true
          maxLength: 255
      required:
      - application_id
      - resource_id
      - resource_type
    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        tenant_id:
          type: string
          readOnly: true
        application_id:
          type: string
          readOnly: true
          nullable: true
        action:
          type: string
          readOnly: true
        entity_type:
          type: string
          readOnly: true
        entity_id:
          type: string
          readOnly: true
        tag_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        resource_type:
          type: string
          readOnly: true
          nullable: true
        resource_id:
